[project]
name = "kaggle-map"
version = "0.1.0"
description = "Map charting student math misunderstandings"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-ai>=0.0.14",
    "python-fasthtml>=0.7.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "toml>=0.10.0",
    "loguru>=0.7.0",
    "plotly>=5.0.0",
    "streamlit>=1.0.0",
    "pytest-asyncio>=1.0.0",
    "kaggle>=1.7.4.5",
    "pandas>=2.0.0",
    "transformers>=4.55.2",
    "numpy>=2.3.2",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.1.0",
    "torch>=2.8.0",
    "platformdirs>=4.0.0",
    "optuna>=3.6.0",
    "optuna-dashboard>=0.15.0",
    "accelerate>=0.25.0",
    "llama-cpp-python>=0.2.0",
    "huggingface-hub>=0.20.0",
    "pydash>=8.0.5",
    "psutil>=7.0.0",
    "better-exceptions>=0.3.3",
    "dotenv>=0.9.9",
    "textual>=6.1.0",
]


[tool.setuptools.packages.find]
include = ["kaggle_map*"]
exclude = ["llms*"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Minimal runtime deps needed by tests when using --no-project
    "pandas>=2.0.0",
    "pydantic",
    "click>=8.0.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "ruff>=0.11.6",
    "ty>=0.0.1a14",
    "pyrefly>=0.31.0",
]


[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
extend-select = [
  "A",      # flake8-builtins - prevent shadowing of built-in names
  "ANN",    # flake8-annotations - enforce type annotations
  "ARG",    # flake8-unused-arguments - detect unused function arguments
  "B",      # flake8-bugbear - find likely bugs and design problems
  "COM",    # flake8-commas - enforce trailing commas
  "C4",     # flake8-comprehensions - improve list/dict/set comprehensions
  "C90",    # mccabe - cyclomatic complexity checks
  "DTZ",    # flake8-datetimez - prevent naive datetime usage
  "E",      # pycodestyle errors - PEP 8 error violations
  "EM",     # flake8-errmsg - enforce error message best practices
  "F",      # pyflakes - detect various Python errors
  "FBT",    # flake8-boolean-trap - prevent boolean trap anti-pattern
  "FURB",   # refurb - modernize Python code
  "I",      # isort - import sorting and organization
  "ISC",    # flake8-implicit-str-concat - prevent implicit string concatenation
  "LOG",    # flake8-logging - logging best practices
  "G",      # flake8-logging-format - logging format string issues
  "N",      # pep8-naming - enforce PEP 8 naming conventions
  "NPY",    # numpy-specific rules - NumPy best practices
  "PD",     # pandas-vet - pandas best practices
  "PERF",   # perflint - performance anti-patterns
  "PIE",    # flake8-pie - miscellaneous improvements
  "PL",     # pylint - comprehensive Python linting
  "PT",     # flake8-pytest-style - pytest best practices
  "PTH",    # flake8-use-pathlib - prefer pathlib over os.path
  "Q",      # flake8-quotes - enforce quote style consistency
  "RET",    # flake8-return - improve return statement usage
  "RUF",    # ruff-specific rules - ruff's own additional checks
  "SIM",    # flake8-simplify - simplify code constructs
  "SLF",    # flake8-self - private member access checks
  "SLOT",   # flake8-slots - enforce __slots__ usage
  "TID",    # flake8-tidy-imports - tidy import organization
  "TC",     # flake8-type-checking - optimize type checking imports
  "UP",     # pyupgrade - upgrade syntax for newer Python versions
  "W",      # pycodestyle warnings - PEP 8 warning violations
]
extend-ignore = [
    "COM812",   # flake8-commas - allow trailing commas in function calls
    "DTZ005",   # flake8-datetimez - allow naive datetime in files
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# Test files - consistent *_test.py naming pattern and tests directory
"**/*_test.py" = [
    "PLR2004",  # Magic values are acceptable in tests
    "S101",     # Assert statements are expected in tests
    "ANN001",   # Missing type annotations for fixtures are OK
    "ANN201",   # Missing return type for fixtures is OK
    "FBT001",   # Boolean parameters are fine in tests
    "PT011",    # Broad pytest.raises is sometimes necessary
    "PT014",    # Duplicate test cases might be intentional for clarity
    "E501",     # Long lines in test data are sometimes necessary
    "PLC0415",  # Import statements are allowed inside test functions
]

# Logger configuration legitimate exceptions
"kaggle_map/utils/logger_config.py" = [
    "PLR0913",  # Many parameters needed for comprehensive logger config
    "SLF001",   # Private member access needed for checking logger state
]

# GGUF model configuration uses uppercase for static configs
"kaggle_map/utils/gguf_model.py" = [
    "N802",     # Function names can be uppercase for class properties
]

[tool.pytest.ini_options]
testpaths = ["kaggle_map", "tests"]
python_files = ["*_test.py"]
addopts = "-vv --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*_test.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

